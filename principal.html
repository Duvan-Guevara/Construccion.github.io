<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Principal</title>
<link rel="stylesheet" href="styles.css">
</head>

<body class="principal">

<!-- NAVBAR -->
<div class="navbar">

  <span>🛒 MiTienda</span>

  <div class="perfil-box">

    <!-- BOTÓN ADMIN -->
    <button
      id="btnAdmin"
      class="btn-admin"
      style="display:none;"
      onclick="toggleAdmin()"
    >
      ⚙️ Admin
    </button>

    <!-- BOTÓN PERFIL -->
    <button
      class="btn-perfil"
      onclick="togglePerfil()"
    >
      👤 Perfil
    </button>

    <!-- PERFIL -->
    <div id="perfilSection" class="perfil-dropdown">

      <h3 id="nombreUsuario"></h3>

      <div class="perfil-dato">
        <label>Teléfono</label>
        <input type="text" id="telefono">
      </div>

      <div class="perfil-dato">
        <label>Dirección</label>
        <input type="text" id="direccion">
      </div>

      <div class="perfil-dato">
        <label>Ciudad</label>
        <input type="text" id="ciudad">
      </div>

      <div class="perfil-botones">

        <button
          id="btnPerfil"
          onclick="guardarPerfil()"
        >
          Guardar
        </button>

        <button
          class="btn-cerrar"
          onclick="cerrarSesion()"
        >
          Cerrar sesión
        </button>

      </div>

      <p id="mensajePerfil"></p>

    </div>

  </div>

</div>

<!-- PANEL ADMIN -->
<div id="adminPanel" class="admin-overlay">

  <div class="admin-modal">

    <div class="admin-header">

      <h2>⚙️ Panel Administrador</h2>

      <button
        class="cerrar-admin"
        onclick="toggleAdmin()"
      >
        X
      </button>

    </div>

    <div class="admin-grid">

      <div class="admin-card" id="cardUsuarios">
        <h3>👥 Usuarios</h3>
        <p>Gestionar usuarios registrados</p>

        <button onclick="cargarUsuarios()">
            Entrar
        </button>
      </div>

      <div class="admin-card">
        <h3>📦 Productos</h3>
        <p>Gestionar productos</p>

          <button onclick="cargarProductos()">
             Entrar
          </button>
      </div>

    </div>

    <div id="contenidoAdmin"></div>
    
  </div>

</div>

<!-- CATÁLOGO -->
<div class="main">

  <h2>Catálogo</h2>

  <div class="catalogo">

    <div class="producto">
      <img src="https://via.placeholder.com/150">
      <h3>Producto 1</h3>
      <p>$100</p>
      <button>Agregar</button>
    </div>

    <div class="producto">
      <img src="https://via.placeholder.com/150">
      <h3>Producto 2</h3>
      <p>$200</p>
      <button>Agregar</button>
    </div>

    <div class="producto">
      <img src="https://via.placeholder.com/150">
      <h3>Producto 3</h3>
      <p>$300</p>
      <button>Agregar</button>
    </div>

  </div>

</div>

<script>

let perfilExiste = false;

window.onload = function () {

  const token =
    localStorage.getItem("token");

  const user =
    JSON.parse(localStorage.getItem("user"));

  // SI NO HAY TOKEN
  if (!token) {
    window.location.href = "login.html";
    return;
  }

  // MOSTRAR NOMBRE
  if (user) {
    document.getElementById(
      "nombreUsuario"
    ).innerText = user.nombre;
  }

  // MOSTRAR BOTÓN ADMIN
  if (
  user &&
  (
    user.role === "admin" ||
    user.role === "operador"
  )
  ) {

  document.getElementById(
    "btnAdmin"
  ).style.display = "block";
  }

  // Funcion del Provedor
  if (user.role === "proveedor") {

  document.getElementById(
    "cardUsuarios"
  ).style.display = "none";
  }

  // CARGAR PERFIL
  fetch(
    "http://localhost:3000/auth/perfil/datos",
    {
      method: "GET",
      headers: {
        Authorization: "Bearer " + token
      }
    }
  )
  .then(res => res.json())
  .then(data => {

    console.log("PERFIL:", data);

    if (data && data.telefono) {

      perfilExiste = true;

      document.getElementById(
        "telefono"
      ).value = data.telefono;

      document.getElementById(
        "direccion"
      ).value = data.direccion;

      document.getElementById(
        "ciudad"
      ).value = data.ciudad;

      document.getElementById(
        "btnPerfil"
      ).innerText = "Editar";
    }
  });
};

// GUARDAR PERFIL
function guardarPerfil() {

  const telefono =
    document.getElementById("telefono").value;

  const direccion =
    document.getElementById("direccion").value;

  const ciudad =
    document.getElementById("ciudad").value;

  const token =
    localStorage.getItem("token");

  const url = perfilExiste
    ? "http://localhost:3000/auth/perfil/actualizar"
    : "http://localhost:3000/auth/perfil";

  const method = perfilExiste
    ? "PUT"
    : "POST";

  fetch(url, {

    method: method,

    headers: {
      "Content-Type": "application/json",
      Authorization: "Bearer " + token
    },

    body: JSON.stringify({
      telefono,
      direccion,
      ciudad
    })

  })
  .then(res => res.json())
  .then(data => {

    document.getElementById(
      "mensajePerfil"
    ).innerText = data.message;

    perfilExiste = true;

    document.getElementById(
      "btnPerfil"
    ).innerText = "Editar";
  });
}

// PERFIL
function togglePerfil() {

  const perfil =
    document.getElementById(
      "perfilSection"
    );

  perfil.style.display =
    perfil.style.display === "block"
      ? "none"
      : "block";
}

// PANEL ADMIN
function toggleAdmin() {

  const panel =
    document.getElementById(
      "adminPanel"
    );

  panel.style.display =
    panel.style.display === "flex"
      ? "none"
      : "flex";
}

async function cargarUsuarios() {

  const token =
    localStorage.getItem("token");

  const res = await fetch(
    "http://localhost:3000/auth/usuarios",
    {
      headers: {
        Authorization: "Bearer " + token
      }
    }
  );

  const usuarios = await res.json();
  console.log(usuarios);

  if (!Array.isArray(usuarios)) {

  document.getElementById(
    "contenidoAdmin"
  ).innerHTML = `
    <p style="color:red;">
      Error cargando usuarios
    </p>
  `;

  return;
  }

  let html = `
    <h2>Usuarios Registrados</h2>

    <table border="1" width="100%">
      <tr>
      <th>ID</th>
        <th>Nombre</th>
        <th>Email</th>
        <th>Rol</th>
        <th>Acciones</th>
      </tr> 
  `;

  usuarios.forEach(user => {

  html += `
    <tr>
      <td>${user.id}</td>
      <td>${user.nombre}</td>
      <td>${user.email}</td>

      <td>

        <select onchange="cambiarRol(${user.id}, this.value)">

          <option value="user"
            ${user.role === "user" ? "selected" : ""}
          >
            user
          </option>

          <option value="operador"
            ${user.role === "operador" ? "selected" : ""}
          >
            operador
          </option>

          <option value="admin"
            ${user.role === "admin" ? "selected" : ""}
          >
            admin
          </option>

        </select>

      </td>

      <td>

        <button onclick="eliminarUsuario(${user.id})">
          Eliminar
        </button>

      </td>
    </tr>
  `;
  });

  html += `</table>`;

  document.getElementById(
    "contenidoAdmin"
  ).innerHTML = html;
}

// CAMBIAR ROL
async function cambiarRol(id, role) {

  const token =
    localStorage.getItem("token");

  const res = await fetch(
    `http://localhost:3000/auth/usuarios/${id}/role`,
    {
      method: "PUT",

      headers: {
        "Content-Type": "application/json",
        Authorization: "Bearer " + token
      },

      body: JSON.stringify({ role })
    }
  );

  const data = await res.json();

  alert(data.message);
}

// ELIMINAR USUARIO
async function eliminarUsuario(id) {

  const confirmar =
    confirm("¿Eliminar usuario?");

  if (!confirmar) return;

  const token =
    localStorage.getItem("token");

  const res = await fetch(
    `http://localhost:3000/auth/usuarios/${id}`,
    {
      method: "DELETE",

      headers: {
        Authorization: "Bearer " + token
      }
    }
  );

  const data = await res.json();

  alert(data.message);

  cargarUsuarios();
}

// CARGAR PRODUCTOS
async function cargarProductos() {

  const token =
    localStorage.getItem("token");

  const res = await fetch(
    "http://localhost:3000/products"
  );

  const productos =
    await res.json();

  let html = `

    <h2>Gestión Productos</h2>

    <div class="form-producto">

      <input
        type="text"
        id="nombreProducto"
        placeholder="Nombre"
      >

      <input
        type="text"
        id="descripcionProducto"
        placeholder="Descripción"
      >

      <input
        type="number"
        id="precioProducto"
        placeholder="Precio"
      >

      <input
        type="number"
        id="stockProducto"
        placeholder="Stock"
      >

      <input
        type="text"
        id="imagenProducto"
        placeholder="URL Imagen"
      >

      <button onclick="crearProducto()">
        Guardar Producto
      </button>

    </div>

    <table border="1" width="100%">

      <tr>
        <th>ID</th>
        <th>Nombre</th>
        <th>Precio</th>
        <th>Stock</th>
        <th>Acciones</th>
      </tr>
  `;

  productos.forEach(producto => {

    html += `
      <tr>

        <td>${producto.id}</td>

        <td>${producto.nombre}</td>

        <td>$${producto.precio}</td>

        <td>${producto.stock}</td>

        <td>

          <button
            onclick="eliminarProducto(${producto.id})"
          >
            Eliminar
          </button>

        </td>

      </tr>
    `;
  });

  html += `</table>`;

  document.getElementById(
    "contenidoAdmin"
  ).innerHTML = html;
}

// CREAR PRODUCTO
async function crearProducto() {

  const token =
    localStorage.getItem("token");

  const nombre =
    document.getElementById(
      "nombreProducto"
    ).value;

  const descripcion =
    document.getElementById(
      "descripcionProducto"
    ).value;

  const precio =
    document.getElementById(
      "precioProducto"
    ).value;

  const stock =
    document.getElementById(
      "stockProducto"
    ).value;

  const imagen =
    document.getElementById(
      "imagenProducto"
    ).value;

  const res = await fetch(
    "http://localhost:3000/products",
    {
      method: "POST",

      headers: {
        "Content-Type": "application/json",
        Authorization: "Bearer " + token
      },

      body: JSON.stringify({
        nombre,
        descripcion,
        precio,
        stock,
        imagen
      })
    }
  );

  const data = await res.json();

  alert(data.message);

  cargarProductos();
}

// ELIMINAR PRODUCTO
async function eliminarProducto(id) {

  const confirmar =
    confirm("¿Eliminar producto?");

  if (!confirmar) return;

  const token =
    localStorage.getItem("token");

  const res = await fetch(
    `http://localhost:3000/products/${id}`,
    {
      method: "DELETE",

      headers: {
        Authorization: "Bearer " + token
      }
    }
  );

  const data = await res.json();

  alert(data.message);

  cargarProductos();
}

// EDITAR PRODUCTO
function editarProducto(
  id,
  nombre,
  descripcion,
  precio,
  stock,
  imagen
) {

  document.getElementById(
    "nombreProducto"
  ).value = nombre;

  document.getElementById(
    "descripcionProducto"
  ).value = descripcion;

  document.getElementById(
    "precioProducto"
  ).value = precio;

  document.getElementById(
    "stockProducto"
  ).value = stock;

  document.getElementById(
    "imagenProducto"
  ).value = imagen;

  const boton =
    document.querySelector(
      ".form-producto button"
    );

  boton.innerText =
    "Actualizar Producto";

  boton.onclick = () =>
    actualizarProducto(id);
}

// ACTUALIZAR PRODUCTO
async function actualizarProducto(id) {

  const token =
    localStorage.getItem("token");

  const nombre =
    document.getElementById(
      "nombreProducto"
    ).value;

  const descripcion =
    document.getElementById(
      "descripcionProducto"
    ).value;

  const precio =
    document.getElementById(
      "precioProducto"
    ).value;

  const stock =
    document.getElementById(
      "stockProducto"
    ).value;

  const imagen =
    document.getElementById(
      "imagenProducto"
    ).value;

  const res = await fetch(
    `http://localhost:3000/products/${id}`,
    {
      method: "PUT",

      headers: {
        "Content-Type": "application/json",
        Authorization: "Bearer " + token
      },

      body: JSON.stringify({
        nombre,
        descripcion,
        precio,
        stock,
        imagen
      })
    }
  );

  const data =
    await res.json();

  alert(data.message);

  cargarProductos();
}

// CERRAR SESIÓN
function cerrarSesion() {

  localStorage.removeItem("token");

  localStorage.removeItem("user");

  window.location.href = "login.html";
}

</script>

</body>
</html>
